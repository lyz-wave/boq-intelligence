domain_code: "05_land_consolidation"
domain_name: "全域土地综合整治工程"

unit_normalizations:
  "公顷": { standard: "hm²", factor: 1.0 }
  "hm²": { standard: "hm²", factor: 1.0 }
  "亩": { standard: "hm²", factor: 0.06666667 }
  "㎡": { standard: "m²", factor: 1.0 }
  "m²": { standard: "m²", factor: 1.0 }
  "m³": { standard: "m³", factor: 1.0 }
  "立方米": { standard: "m³", factor: 1.0 }
  "米": { standard: "m", factor: 1.0 }
  "m": { standard: "m", factor: 1.0 }
  "棵": { standard: "棵", factor: 1.0 }
  "株": { standard: "棵", factor: 1.0 }
  "t": { standard: "t", factor: 1.0 }
  "吨": { standard: "t", factor: 1.0 }

name_synonyms:
  "清表，推土机推土": "地表清理"
  "原土 土（石）方运输": "土石方运输"
  "土（石）方运输": "土石方运输"
  "土（石）方回填": "土石方回填"
  "土（石）方开挖": "土石方开挖"
  "土方开挖": "土石方开挖"
  "土方回填": "土石方回填"

categories:
  - category_code: "05_01_earthwork"
    category_name: "土地平整与土石方工程"
    trigger_keywords: ["伐树", "清表", "拆除", "表土剥离", "土（石）方", "土方", "运距", "压实", "田埂", "田坎", "犁地层", "土地翻耕"]
    slots:
      - key: "operation_type"
        label: "作业类型"
        dimension: "process_work"
        hard_constraint: true
        weight: 0.35
        regex: "(伐树[、，]?推树根[、，]?转运|清表|拆除棚户|拆除物弃运|表土剥离|表土回填|土（石）方运输|土方开挖|土（石）方开挖|土方回填|土（石）方回填|田埂修筑|田坎修筑|土地翻耕|犁地层压实)"
      - key: "haul_distance_m"
        label: "运距/推距(m)"
        dimension: "env_condition"
        hard_constraint: true
        weight: 0.35
        regex: "(?:运距|推土|综合运距为?)\\s*(\\d+(?:\\.\\d+)?\\s*(?:km|m|公里|米))"
        compute_mode: "distance_to_m"
        unit: "m"
      - key: "soil_or_work_sub"
        label: "部位/工艺细分"
        dimension: "env_condition"
        hard_constraint: false
        weight: 0.15
        regex: "(田块内土方调配|田块间土方调配|土方压实|原土夯实|农沟|农渠|涵管|蓄水池|素土垒筑|注水前|注水后)"
      - key: "layer_thickness_m"
        label: "厚度(m)"
        dimension: "entity_spec"
        hard_constraint: false
        weight: 0.15
        regex: "(\\d+(?:\\.\\d+)?)\\s*(?:m|cm)厚?"
        compute_mode: "float"

  - category_code: "05_02_irrigation_concrete"
    category_name: "农田水利、管网与混凝土构筑物"
    trigger_keywords: ["PE管", "Dn", "三通", "闸阀", "混凝土", "砼", "垫层", "钢筋", "伸缩缝", "涵管", "抹面", "砌砖", "闸板", "止水带"]
    slots:
      - key: "entity_type"
        label: "构筑物/管件名称"
        dimension: "entity_spec"
        hard_constraint: true
        weight: 0.35
        regex: "(PE管|三通|闸阀|混凝土涵管|混凝土|砼|级配碎石垫层|碎石垫层|砂垫层|钢筋|伸缩缝|松木闸板|橡胶止水带|砌砖|抹面)"
      - key: "concrete_grade"
        label: "混凝土标号"
        dimension: "entity_spec"
        hard_constraint: true
        weight: 0.25
        regex: "(C\\d{2}|M\\d+(?:\\.\\d)?)"
      - key: "nominal_diameter_mm"
        label: "管径(mm)"
        dimension: "entity_spec"
        hard_constraint: true
        weight: 0.25
        regex: "(?:De|Dn|DN|D)\\s*(\\d+)"
        compute_mode: "float"
        unit: "mm"
      - key: "part_location"
        label: "结构部位"
        dimension: "process_work"
        hard_constraint: false
        weight: 0.15
        regex: "(底板|边墙|拉梁|渠底|渠壁|挡土墙|垫层|平面|立面)"

  - category_code: "05_03_road_and_soil"
    category_name: "田间道路与土壤改良"
    trigger_keywords: ["生产路", "路基", "面层", "路床", "水稳层", "泥结碎石", "有机肥", "生石灰", "植草护坡", "彩条布", "围堰"]
    slots:
      - key: "entity_type"
        label: "路面/改良材料"
        dimension: "entity_spec"
        hard_constraint: true
        weight: 0.40
        regex: "(泥结碎石面层|水泥混凝土面层|水稳层|碎石路基|素土路基|路床压实|有机肥购置|施肥|生石灰调节PH|三维网|彩条布|围堰)"
      - key: "thickness_cm"
        label: "结构层厚度(cm)"
        dimension: "entity_spec"
        hard_constraint: true
        weight: 0.35
        regex: "(?:厚度?|)\\s*(\\d+(?:\\.\\d+)?)\\s*(?:cm|mm|厚)"
        compute_mode: "float"
      - key: "road_width_m"
        label: "路幅宽度(m)"
        dimension: "entity_spec"
        hard_constraint: false
        weight: 0.25
        regex: "(\\d+(?:\\.\\d+)?)m?宽"
        compute_mode: "float"
